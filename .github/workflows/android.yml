name: Build Alieba Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare stable Alieba signing key
        env:
          ALIEBA_KEYSTORE_BASE64: ${{ secrets.ALIEBA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ALIEBA_KEYSTORE_BASE64" ]; then
            echo "::error::ALIEBA_KEYSTORE_BASE64 secret yoxdur."
            exit 1
          fi
          echo "$ALIEBA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alieba-release.jks"
          echo "ALIEBA_KEYSTORE_PATH=$RUNNER_TEMP/alieba-release.jks" >> "$GITHUB_ENV"

      - name: Build stable signed release APK
        env:
          ALIEBA_KEYSTORE_PASSWORD: ${{ secrets.ALIEBA_KEYSTORE_PASSWORD }}
          ALIEBA_KEY_ALIAS: alieba
          ALIEBA_KEY_PASSWORD: ${{ secrets.ALIEBA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ALIEBA_KEYSTORE_PASSWORD" ]; then
            echo "::error::ALIEBA_KEYSTORE_PASSWORD secret yoxdur."
            exit 1
          fi
          gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Alieba-V21.6-release-apk
          path: app/build/outputs/apk/release/app-release.apk
